<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sickle Scaler 플래시카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one centered flip card under a slim header; category chips scroll sideways; controls below the card. */
:root {
  --bg: #e9eef1;
  --surface: #ffffff;
  --back: #f1f8f7;
  --ink: #14232b;
  --muted: #5a6b74;
  --line: #cbd6dc;
  --accent: #0b7a75;
  --accent-ink: #ffffff;
  --chip: #dbe5ea;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171b; --surface: #182329; --back: #12302f; --ink: #e6eef1; --muted: #93a5ad;
    --line: #2b3b43; --accent: #4fc4bb; --accent-ink: #072523; --chip: #223038; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171b; --surface: #182329; --back: #12302f; --ink: #e6eef1; --muted: #93a5ad;
  --line: #2b3b43; --accent: #4fc4bb; --accent-ink: #072523; --chip: #223038; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 1.25rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.count { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.chip {
  flex: none; font: inherit; font-size: 0.85rem; padding: 6px 12px; border-radius: 999px; cursor: pointer;
  background: var(--chip); color: var(--ink); border: 1px solid transparent;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip:focus-visible, .btn:focus-visible, .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.stage { perspective: 1400px; }
.card { display: grid; width: 100%; min-height: 380px; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left;
  transform-style: preserve-3d; transition: transform .45s; }
.card.flipped { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1; display: flex; flex-direction: column; gap: 14px; padding: 22px;
  border: 1px solid var(--line); border-radius: 10px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.front { background: var(--surface); justify-content: space-between; }
.backface { background: var(--back); transform: rotateY(180deg); border-color: var(--accent); }
.tag { display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.tag b { color: var(--accent); font-weight: 500; }
.q { font-size: 1.35rem; line-height: 1.5; font-weight: 700; margin: 0; text-wrap: balance; flex: 1; display: flex; align-items: center; }
.hint { font-size: 0.8rem; color: var(--muted); }
.ans { font-size: 1.05rem; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ans p { margin: 0; }
.ans ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.ans strong { color: var(--accent); font-weight: 700; }
.ans .note { font-size: 0.85rem; color: var(--muted); }
figure { margin: 0; display: flex; flex-direction: column; gap: 4px; align-items: center; }
figure img { max-width: 100%; height: auto; max-height: 260px; border-radius: 6px; background: #fff; border: 1px solid var(--line); }
figcaption { font-size: 0.75rem; color: var(--muted); }
.controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
  font: inherit; font-size: 0.95rem; padding: 10px 18px; border-radius: 8px; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.src { font-size: 0.75rem; color: var(--muted); text-align: center; }
@media (max-width: 480px) { .q { font-size: 1.2rem; } .face { padding: 18px; } }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .bar i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div class="top">
      <h1>Sickle Scaler 플래시카드</h1>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="chips" id="chips" role="group" aria-label="분류 선택"></div>
  </header>

  <div class="stage">
    <button class="card" id="card" type="button" aria-label="카드 뒤집기">
      <div class="face front">
        <div class="tag"><b id="fcat"></b><span>질문</span></div>
        <p class="q" id="q"></p>
        <div class="hint">카드를 누르면 뒤집힙니다</div>
      </div>
      <div class="face backface">
        <div class="tag"><b id="bcat"></b><span>설명</span></div>
        <div class="ans" id="ans"></div>
      </div>
    </button>
  </div>

  <div class="controls">
    <button class="btn" id="prev" type="button">이전</button>
    <button class="btn primary" id="flip" type="button">뒤집기</button>
    <button class="btn" id="next" type="button">다음</button>
    <button class="btn" id="shuffle" type="button" aria-pressed="false">섞기</button>
  </div>
  <div class="src">출처: 세마론 PBL – Sickle Scaler 정리 (교과서 249~250쪽 그림 10-59~10-62)</div>
</div>

var cats = ["전체"];
CARDS.forEach(function (d) { if (cats.indexOf(d.c) < 0) cats.push(d.c); });
var cat = "전체", deck = [], idx = 0, shuffled = false;
var $ = function (id) { return document.getElementById(id); };

function build() {
  deck = CARDS.filter(function (d) { return cat === "전체" || d.c === cat; });
  if (shuffled) {
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
  }
  idx = 0; show();
}
function show() {
  var d = deck[idx];
  $("card").classList.remove("flipped");
  $("fcat").textContent = d.c; $("bcat").textContent = d.c;
  $("q").textContent = d.q;
  var h = d.a;
  if (d.img) h += '<figure><img src="' + IMG[d.img] + '" alt="' + d.cap + '"><figcaption>' + d.cap + '</figcaption></figure>';
  if (d.note) h += '<p class="note">' + d.note + '</p>';
  $("ans").innerHTML = h;
  $("count").textContent = (idx + 1) + " / " + deck.length;
  $("bar").style.width = ((idx + 1) / deck.length * 100) + "%";
  $("prev").disabled = idx === 0; $("next").disabled = idx === deck.length - 1;
}
function flip() { $("card").classList.toggle("flipped"); }
function go(n) { var k = idx + n; if (k >= 0 && k < deck.length) { idx = k; show(); } }

cats.forEach(function (c) {
  var b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = c; b.setAttribute("aria-pressed", c === cat ? "true" : "false");
  b.addEventListener("click", function () {
    cat = c;
    Array.prototype.forEach.call($("chips").children, function (x) { x.setAttribute("aria-pressed", x.textContent === c ? "true" : "false"); });
    build();
  });
  $("chips").appendChild(b);
});
$("card").addEventListener("click", flip);
$("flip").addEventListener("click", flip);
$("prev").addEventListener("click", function () { go(-1); });
$("next").addEventListener("click", function () { go(1); });
$("shuffle").addEventListener("click", function () {
  shuffled = !shuffled; this.setAttribute("aria-pressed", shuffled ? "true" : "false");
  this.textContent = shuffled ? "순서대로" : "섞기"; build();
});
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === " " && e.target === document.body) { e.preventDefault(); flip(); }
});
build();
</script>
