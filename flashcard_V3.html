<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>치과기구 · 치주기구 플래시카드 (통합)</title>
<style>
:root{--bg:#f3f7fe;--card:#d9e5f9;--bd:#86a8e8;--pill:#6f9fe8;--tx:#1d2b4f;--sub:#4a6aa5;--w:#fff;--hl:#fde8a6;--btn:#fff;--fg:#1B2A5C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2b;--card:#26365e;--bd:#4a6aa5;--pill:#4f7fd0;--tx:#eaf0ff;--sub:#9db6e8;--w:#1c2644;--hl:#6b5a1f;--btn:#26365e;--fg:#dfe7fa}}
:root[data-theme="dark"]{--bg:#141a2b;--card:#26365e;--bd:#4a6aa5;--pill:#4f7fd0;--tx:#eaf0ff;--sub:#9db6e8;--w:#1c2644;--hl:#6b5a1f;--btn:#26365e;--fg:#dfe7fa}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
header{width:100%;max-width:520px;padding:14px 18px 4px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sub);font-weight:700}
.pbar{width:calc(100% - 36px);max-width:484px;height:5px;background:var(--card);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pill);width:0;transition:width .25s}
.stage{flex:1;width:100%;max-width:520px;padding:22px 18px 8px;min-height:0}
#va{height:100%;perspective:1200px}
nav{width:100%;max-width:520px;padding:10px 18px 16px;display:flex;gap:10px}
nav button{flex:1;font:inherit;font-size:15px;font-weight:700;padding:13px 0;border-radius:16px;border:2px solid var(--bd);background:var(--btn);color:var(--tx);cursor:pointer}
nav button.p{background:var(--pill);color:#fff;border-color:var(--pill)}
/* ===== A 카드 스타일 ===== */
#va .card{position:relative;width:100%;height:100%;max-height:640px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
#va .card.flip{transform:rotateY(180deg)}
#va .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--bd);border-radius:28px;background:var(--card);display:flex;flex-direction:column;align-items:center;padding:34px 18px 18px;box-sizing:border-box;overflow:hidden}
#va .back{transform:rotateY(180deg)}
#va .pill{position:absolute;top:-2px;left:50%;transform:translate(-50%,-50%);background:var(--pill);color:#fff;font-weight:800;font-size:22px;padding:4px 34px;border-radius:22px;border:2px solid var(--bd)}
#va .lab{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px;align-self:flex-start;margin-left:6px}
#va .body{flex:1;width:100%;overflow:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
#va .q{font-size:20px;font-weight:800;line-height:1.55;text-align:center;word-break:keep-all}
#va .pic{background:#fff;border:1.5px solid var(--bd);border-radius:16px;padding:8px;max-width:100%}
#va .pic img{display:block;max-width:100%;max-height:200px;margin:0 auto}
#va .ans{background:var(--w);border-radius:22px;padding:16px 14px;width:100%;box-sizing:border-box}
#va .row{display:flex;gap:10px;align-items:flex-start;margin:7px 0;font-size:17px;font-weight:700;line-height:1.55;word-break:keep-all}
#va .ck{flex:none;width:24px;height:24px;border-radius:50%;background:#5b8fe3;color:#fff;text-align:center;line-height:24px;font-size:13px;margin-top:2px}
#va .hl{background:var(--hl);padding:0 8px;border-radius:8px}
#va .hint{font-size:12px;color:var(--sub);margin-top:auto;padding-top:8px}
/* ===== B 카드 스타일 (뒤집기 카드 안에서 사용) ===== */
#va .face.bf .pill{display:none}
#va .face.bf{padding:14px 14px 10px}
#va .bscroll{flex:1;width:100%;min-height:0;overflow:auto;color:var(--fg);font-family:"Noto Sans CJK KR","Noto Sans KR","Noto Sans CJK JP",sans-serif}
#va .bscroll .bm{margin:auto 0;padding-bottom:6px}
#va .bm .lb{font-size:11px;font-weight:700;color:#3B5FA8;margin:0 0 -2px 2px}
#va .bm .bx{position:relative;border:3px solid #8FB0E8;border-radius:30px;background:-webkit-linear-gradient(top,#E6EEFB,#C9DAF3);background:linear-gradient(#E6EEFB,#C9DAF3);margin:0 0 26px;padding:34px 28px 26px}
#va .bm .tab{position:absolute;top:-21px;left:50%;margin-left:-70px;width:140px;height:40px;line-height:40px;text-align:center;border:3px solid #8FB0E8;border-radius:22px;background:#6E9BE3;color:#fff;font-weight:700;font-size:22px}
#va .bm .q{min-height:130px;text-align:center;font-weight:700;font-size:21px;line-height:1.5;padding:30px 20px}
#va .bm .q span{display:block;padding-top:22px}
#va .bm .sp{position:absolute;right:30px;top:36px;color:#4C7FD8;font-size:20px}
#va .bm .m{position:absolute;left:26px;bottom:-4px;width:46px;height:52px;background:#fff;border:1.5px solid #6E9BE3;border-radius:13px}
#va .bm .m i{position:absolute;top:18px;width:4px;height:4px;border-radius:2px;background:#1B2A5C}
#va .bm .m i.a{left:13px}
#va .bm .m i.b{left:29px}
#va .bm .m u{position:absolute;top:25px;left:17px;width:12px;height:6px;border-bottom:2px solid #1B2A5C;border-radius:0 0 8px 8px;text-decoration:none}
#va .bm .m s{position:absolute;bottom:-14px;width:9px;height:16px;border:1.5px solid #6E9BE3;border-radius:0 0 5px 5px;background:#fff}
#va .bm .m s.a{left:7px}
#va .bm .m s.b{left:28px}
#va .bm .in{position:relative;background:#fff;border-radius:22px;padding:26px 28px 40px;min-height:120px}
#va .bm .it{margin:0 0 12px;font-size:17px;font-weight:700;line-height:1.45;padding-left:40px;position:relative}
#va .bm .ck{position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:13px;background:#5B8DE0;color:#fff;text-align:center;line-height:26px;font-size:15px}
#va .bm .h{background:#FBE5A0;border-radius:8px;padding:1px 7px;color:#111}
#va .bm .bar{position:absolute;left:28px;right:28px;bottom:14px;height:12px;border-radius:6px;background:#F7A9A9}
#va .bm .th{position:absolute;right:28px;bottom:26px}
#va .bm .th b{display:inline-block;width:20px;border:1.5px solid #6E9BE3;border-bottom:0;border-radius:6px 6px 0 0;margin-left:6px;background:#fff}
#va .bm .im{display:block;margin:14px auto 0;max-width:100%;max-height:64mm;border-radius:10px}
#va .bm .ck{margin-top:0}
#va .bm .bx{margin-top:30px}
</style></head><body>

else{fc.classList.add('bf');bc.classList.add('bf');

function nav(d){const was=card.classList.contains('flip');card.classList.remove('flip');
if(was){setTimeout(()=>{pos=(pos+d+items.length)%items.length;render()},260)}
else{pos=(pos+d+items.length)%items.length;render()}}
card.onclick=toggle;$('flip').onclick=toggle;
$('prev').onclick=()=>nav(-1);$('next').onclick=()=>nav(1);
